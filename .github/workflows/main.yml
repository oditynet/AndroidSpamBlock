name: Android Auto Release

on:
  workflow_dispatch: 
  push:
    tags:
      - 'ver_*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Release APK
      run: ./gradlew assembleRelease

    # Берем системное имя тега и переименовываем файл под ваш формат
    - name: Rename APK for Release
      run: |
        TAG_NAME="${{ github.ref_name }}"
        VERSION_NUMBER="${TAG_NAME#ver_}"
        mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/AndroidSpamBlock-${VERSION_NUMBER}.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: |
          app/build/outputs/apk/release/AndroidSpamBlock-*.apk    
