name: Android Auto Release

on:
  push:
    # Скрипт сработает только тогда, когда вы вешаете на код тег версии (например, ver_0.3.7)
    tags:
      - 'ver_*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Даем роботу право создавать релизы на вашем гитхабе

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Собираем сразу релизный (чистый) APK файл
    - name: Build Release APK
      run: ./gradlew assembleRelease

    # Автоматически создаем релиз на GitHub и прикрепляем туда готовый APK
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        # Берем имя тега (например, ver_0.3.7)
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        # Указываем путь к собранному файлу и переименовываем его под формат вашей системы обновления
        files: |
          app/build/outputs/apk/release/app-release-unsigned.apk
